[project]
name = "fretlines-worker"
version = "0.3.0"
description = "Анализ песен Fretlines: загрузка, стемы, доли, аккорды, мелодия, бас, гитара, текст"
requires-python = "==3.11.*"
dependencies = [
    "fretlines-arranger",
    "beat-this>=1.1",
    "audio-separator[cpu]>=0.48",  # вокал и инструментал моделями уровня UVR (RoFormer, MDX)
    "demucs>=4.1",
    "faster-whisper>=1.2",  # текст песни по вокальной дорожке
    "imageio-ffmpeg>=0.8",
    "librosa>=0.11",
    "numpy>=1.26",
    "onnxruntime>=1.20",  # Basic Pitch: ноты гитары и гармония
    "scipy>=1.13",
    "soundfile>=0.13",
    "torch>=2.11,<2.12",  # torchaudio выпускается в паре с torch той же версии
    "torchaudio>=2.11",
    "torchcrepe>=0.0.24",
    "yt-dlp[default,deno]>=2026.10",
]

[tool.uv.sources]
fretlines-arranger = { workspace = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fretlines_worker"]
