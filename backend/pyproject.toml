[project]
name = "fretlines-api"
version = "0.2.0"
description = "HTTP API Fretlines: песни, задачи анализа, аранжировки, раздача интерфейса"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "fretlines-arranger",
    "fretlines-worker",
]

[tool.uv.sources]
fretlines-arranger = { workspace = true }
fretlines-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fretlines_api"]
